name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 04:17 UTC — scan against the latest security machinery.
    - cron: "17 4 * * 1"

permissions:
  contents: read

# Cancel superseded runs on the same branch or PR — save the free-tier minutes.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      # codeql-action reads the workflow run via the Actions API for its status
      # report + SARIF metadata; without actions: read the analyze step dies
      # with "Resource not accessible by integration" (codeql-action#2117).
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Interpreted languages must use the "none" build mode (no build step).
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
